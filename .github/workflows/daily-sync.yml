name: Denní aktualizace dat
on:
  workflow_dispatch:
  # Ruční spuštění změnou souboru .resync-daily (viz komentář ve weekly-sync.yml).
  push:
    branches: [main]
    paths: ['.resync-daily']
  schedule:
    # 4:17 a 5:17 UTC — druhý běh pokrývá posun letního/zimního času,
    # samotný job běží jen tehdy, je-li v Praze 6:xx.
    - cron: '17 4 * * *'
    - cron: '17 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Je v Praze 6 hodin?
        id: cas
        run: |
          H=$(TZ=Europe/Prague date +%H)
          echo "hodina=$H" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "06" ]; then
            echo "bezet=ano" >> "$GITHUB_OUTPUT"
          else
            echo "bezet=ne" >> "$GITHUB_OUTPUT"
          fi

      # Každý zdroj zvlášť a s continue-on-error: výpadek jednoho nesmí
      # shodit celý běh ani přepsat funkční dataset prázdným souborem.
      - name: Usnesení — MARBES (2022+)
        if: steps.cas.outputs.bezet == 'ano'
        continue-on-error: true
        run: node scripts/sync-usneseni-marbes.mjs

      - name: Úřední deska
        if: steps.cas.outputs.bezet == 'ano'
        continue-on-error: true
        run: node scripts/sync-deska.mjs

      - name: Registr smluv — přírůstek
        if: steps.cas.outputs.bezet == 'ano'
        continue-on-error: true
        run: node scripts/sync-smlouvy.mjs

      - name: Sloučení usnesení
        if: steps.cas.outputs.bezet == 'ano'
        run: node scripts/merge-usneseni.mjs

      - name: Build indexu
        if: steps.cas.outputs.bezet == 'ano'
        run: node scripts/build-index.mjs

      - name: Validace
        if: steps.cas.outputs.bezet == 'ano'
        run: node scripts/validate.mjs

      # always(): nasbíraná data se commitují i při červené validaci — jinak by
      # jedna neprošlá kontrola zahodila několik minut scrapování.
      - name: Commit dat
        if: always() && steps.cas.outputs.bezet == 'ano'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Denní aktualizace dat ($(TZ=Europe/Prague date +%F))"
          git push

  # Data se commitla — teď z nich publikovat web. Musí to být takhle explicitně,
  # spoléhat na push událost nejde (viz komentář v pages.yml).
  publikovat:
    needs: sync
    if: always()
    uses: ./.github/workflows/pages.yml
