name: Backfill registru smluv
# Ruční, pouštět zřídka: projde všechny měsíční dumpy registru smluv.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: BACKFILL=1 node scripts/sync-smlouvy.mjs
      - run: node scripts/validate.mjs
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Backfill registru smluv"
          git push
