name: Jednorázový balíček — veřejné zakázky
# Doručovací workflow. Do repozitáře se nedá pushnout z prostředí, kde sekce
# vznikla, takže sem soubory přišly zabalené v base64. Workflow je rozbalí,
# spustí testy, commitne, stáhne profil zadavatele a nakonec sebe smaže.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-zakazky.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync

jobs:
  aplikovat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

