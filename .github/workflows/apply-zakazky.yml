      - name: Testy
        run: npm test

      - name: Commit kódu
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "beze změn" || git commit -m "Veřejné zakázky: profil zadavatele, párování se smlouvami a sekce na webu"
          git push

      - name: Profil zadavatele
        run: node scripts/sync-zakazky.mjs

      - name: Build indexu (spáruje zakázky se smlouvami)
        if: always()
        continue-on-error: true
        run: node scripts/build-index.mjs

      - name: Kontrola dat
        if: always()
        continue-on-error: true
        run: node scripts/validate.mjs

      - name: Commit dat
        if: always()
        run: |
          git add data/
          git diff --staged --quiet && echo "beze změn" && exit 0
          git commit -m "Veřejné zakázky ($(TZ=Europe/Prague date +%F))"
          git push

