name: Přepočítat a publikovat
# Přepočítá sloučení usnesení a fulltextový index z toho, co je v data/, a publikuje web.
# Spouští se commitem do web/ nebo změnou souboru .rebuild — to je záchranná brzda,
# když je potřeba web překreslit bez čekání na noční synchronizaci.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.rebuild'
      - 'web/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync

jobs:
  prepocitat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Sloučení usnesení
        continue-on-error: true
        run: node scripts/merge-usneseni.mjs

      - name: Build indexu
        continue-on-error: true
        run: node scripts/build-index.mjs

      - name: Validace
        if: always()
        continue-on-error: true
        run: node scripts/validate.mjs

      - name: Commit dat
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Přepočet indexu ($(TZ=Europe/Prague date +%F))"
          # Bez || true — neúspěšný push nesmí projít jako zelený běh.
          git push

  publikovat:
    needs: prepocitat
    if: always()
    uses: ./.github/workflows/pages.yml
