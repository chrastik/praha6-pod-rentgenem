name: Smlouvy zřizovaných organizací
# Projde vyhledávání registru smluv pro všech 38 subjektů zřizovaných MČ Praha 6
# a přepíše dataset. Je to úplná obnova, ne přírůstek — registr mění i starší
# záznamy a celý průchod trvá jednotky minut.
#
# Ruční spuštění: změnit obsah souboru .organizace a commitnout.
# Tlačítko „Run workflow" je na tomhle repozitáři nespolehlivé, commit funguje vždy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.organizace'
      - 'scripts/sync-smlouvy-organizace.mjs'
      - 'scripts/lib/organizace.mjs'
      - 'scripts/lib/vysledky.mjs'
  schedule:
    - cron: '20 5 * * 2'   # úterý, aby se to nepralo s pondělní týdenní synchronizací

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync

jobs:
  organizace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Smlouvy organizací a firem
        run: node scripts/sync-smlouvy-organizace.mjs

      - name: Build indexu (obnoví manifest a časové razítko)
        if: always()
        continue-on-error: true
        run: node scripts/build-index.mjs

      # Commit i při chybě: když selže část subjektů, to, co se stáhlo, má zůstat.
      - name: Commit dat
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Smlouvy zřizovaných organizací ($(TZ=Europe/Prague date +%F))"
          git push || true

  publikovat:
    needs: organizace
    if: always()
    uses: ./.github/workflows/pages.yml
